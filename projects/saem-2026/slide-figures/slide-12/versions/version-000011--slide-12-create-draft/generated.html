<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit It Into Workflow, Not Around Workflow</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        .slide-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: -1;
        }
        .content-area {
            position: absolute;
            top: 140px;
            left: 120px;
            width: 1680px;
            height: 740px;
            z-index: 1;
        }
        h1 {
            font-size: 64px;
            font-weight: 800;
            color: #0B1B3D;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        h2 {
            font-size: 32px;
            font-weight: 400;
            color: #475569;
            margin: 0 0 80px 0;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        .citation {
            font-size: 0.65em;
            color: #94A3B8;
            font-weight: 500;
            vertical-align: super;
            margin-left: 8px;
            letter-spacing: 0.02em;
        }
        .figure-container {
            width: 1680px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Full-slide background image layer -->
        <img class="shell bg-image" src="../../../../templates/saem-annual-meeting-template-v1/template.png" alt="" aria-hidden="true" />
        
        <div class="content-area">
            <h1>Fit it into workflow, not around workflow.</h1>
            <h2>Microlearning works best when it lives where clinicians already are.<span class="citation">[2, 7, 8, 15, 23]</span></h2>
            
            <div class="figure-container">
                <svg width="1680" height="400" viewBox="0 0 1680 400" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Drop shadow for cards -->
                        <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
                            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
                        </filter>
                    </defs>

                    <!-- Continuous Timeline Background Line -->
                    <line x1="40" y1="200" x2="1640" y2="200" stroke="#E2E8F0" stroke-width="6" stroke-dasharray="12 12" />

                    <!-- Connectors / Chevrons between cards -->
                    <!-- Gap 1 -->
                    <path d="M 405 185 L 425 200 L 405 215" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Gap 2 -->
                    <path d="M 825 185 L 845 200 L 825 215" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Gap 3 -->
                    <path d="M 1245 185 L 1265 200 L 1245 215" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

                    <!-- Card 1: Pre-Shift -->
                    <g transform="translate(40, 40)">
                        <!-- Card Base -->
                        <rect x="0" y="0" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" filter="url(#card-shadow)"/>
                        
                        <!-- Header Area -->
                        <path d="M0,16 a16,16 0 0 1 16,-16 h308 a16,16 0 0 1 16,16 v64 h-340 v-64 z" fill="#F8FAFC"/>
                        <line x1="0" y1="80" x2="340" y2="80" stroke="#E2E8F0" stroke-width="1"/>
                        <text x="170" y="52" fill="#0B1B3D" font-size="24" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Pre-Shift</text>
                        
                        <!-- Middle Content -->
                        <text x="170" y="135" fill="#334155" font-size="22" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Huddle &amp; Hand-off</text>
                        <text x="170" y="170" fill="#64748B" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif">Brief cognitive priming</text>
                        
                        <!-- Microlearning Slot (Base) -->
                        <path d="M0,220 h340 v84 a16,16 0 0 1 -16,16 h-308 a16,16 0 0 1 -16,-16 v-84 z" fill="#0055A4"/>
                        <line x1="0" y1="220" x2="340" y2="220" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <text x="170" y="282" fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">pearl</text>
                    </g>

                    <!-- Card 2: Point of Care -->
                    <g transform="translate(460, 40)">
                        <!-- Card Base -->
                        <rect x="0" y="0" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" filter="url(#card-shadow)"/>
                        
                        <!-- Header Area -->
                        <path d="M0,16 a16,16 0 0 1 16,-16 h308 a16,16 0 0 1 16,16 v64 h-340 v-64 z" fill="#F8FAFC"/>
                        <line x1="0" y1="80" x2="340" y2="80" stroke="#E2E8F0" stroke-width="1"/>
                        <text x="170" y="52" fill="#0B1B3D" font-size="24" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Point of Care</text>
                        
                        <!-- Middle Content -->
                        <text x="170" y="135" fill="#334155" font-size="22" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Patient Encounters</text>
                        <text x="170" y="170" fill="#64748B" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif">Clinical uncertainty</text>
                        
                        <!-- Microlearning Slot (Base) -->
                        <path d="M0,220 h340 v84 a16,16 0 0 1 -16,16 h-308 a16,16 0 0 1 -16,-16 v-84 z" fill="#C8102E"/>
                        <line x1="0" y1="220" x2="340" y2="220" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <text x="170" y="282" fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">question</text>
                    </g>

                    <!-- Card 3: Charting -->
                    <g transform="translate(880, 40)">
                        <!-- Card Base -->
                        <rect x="0" y="0" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" filter="url(#card-shadow)"/>
                        
                        <!-- Header Area -->
                        <path d="M0,16 a16,16 0 0 1 16,-16 h308 a16,16 0 0 1 16,16 v64 h-340 v-64 z" fill="#F8FAFC"/>
                        <line x1="0" y1="80" x2="340" y2="80" stroke="#E2E8F0" stroke-width="1"/>
                        <text x="170" y="52" fill="#0B1B3D" font-size="24" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Charting</text>
                        
                        <!-- Middle Content -->
                        <text x="170" y="135" fill="#334155" font-size="22" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Documentation</text>
                        <text x="170" y="170" fill="#64748B" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif">Task transition &amp; downtime</text>
                        
                        <!-- Microlearning Slot (Base) -->
                        <path d="M0,220 h340 v84 a16,16 0 0 1 -16,16 h-308 a16,16 0 0 1 -16,-16 v-84 z" fill="#0055A4"/>
                        <line x1="0" y1="220" x2="340" y2="220" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <text x="170" y="282" fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">curated module</text>
                    </g>

                    <!-- Card 4: Post-Shift -->
                    <g transform="translate(1300, 40)">
                        <!-- Card Base -->
                        <rect x="0" y="0" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" filter="url(#card-shadow)"/>
                        
                        <!-- Header Area -->
                        <path d="M0,16 a16,16 0 0 1 16,-16 h308 a16,16 0 0 1 16,16 v64 h-340 v-64 z" fill="#F8FAFC"/>
                        <line x1="0" y1="80" x2="340" y2="80" stroke="#E2E8F0" stroke-width="1"/>
                        <text x="170" y="52" fill="#0B1B3D" font-size="24" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Post-Shift</text>
                        
                        <!-- Middle Content -->
                        <text x="170" y="135" fill="#334155" font-size="22" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Commute &amp; Off-Shift</text>
                        <text x="170" y="170" fill="#64748B" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif">Reflection &amp; consolidation</text>
                        
                        <!-- Microlearning Slot (Base) -->
                        <path d="M0,220 h340 v84 a16,16 0 0 1 -16,16 h-308 a16,16 0 0 1 -16,-16 v-84 z" fill="#0B1B3D"/>
                        <line x1="0" y1="220" x2="340" y2="220" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
                        <text x="170" y="282" fill="#FFFFFF" font-size="26" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">case follow-up</text>
                    </g>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
