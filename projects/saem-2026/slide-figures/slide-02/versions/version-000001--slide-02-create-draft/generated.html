<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEM Slide 2 - Microlearning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .slide {
            width: 1920px;
            height: 1080px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }
        .shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
        }
        .content {
            position: absolute;
            top: 112px;
            left: 124px;
            right: 124px;
            bottom: 286px;
            z-index: 2;
        }
        .header-group {
            margin-bottom: 42px;
        }
        .header-copy {
            max-width: 1480px;
        }
        h1 {
            font-size: 72px;
            font-weight: 700;
            color: #0f2040;
            letter-spacing: -0.03em;
            margin-bottom: 18px;
            line-height: 1.04;
        }
        h2 {
            font-size: 39px;
            font-weight: 400;
            color: #4a5568;
            line-height: 1.28;
        }
        .evidence {
            font-size: 24px;
            color: #94a3b8;
            vertical-align: super;
            font-weight: 600;
            margin-left: 4px;
            white-space: nowrap;
        }
        .visual-container {
            position: absolute;
            left: 0;
            right: 0;
            top: 184px;
            height: 370px;
        }
        .core-message {
            position: absolute;
            left: 500px;
            right: 0;
            bottom: 0;
            padding: 22px 26px;
            border-radius: 24px;
            border: 1px solid rgba(15, 32, 64, 0.09);
            background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(247,250,253,0.96) 100%);
            box-shadow: 0 12px 26px rgba(15, 32, 64, 0.06);
            font-size: 31px;
            font-weight: 600;
            color: #0f2040;
            text-align: left;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 14px;
        }
        .core-message span {
            color: #004b87;
        }
        .core-message svg {
            flex: 0 0 auto;
        }
        svg text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="slide">
        <img class="shell" src="../../../../templates/saem-annual-meeting-template-v1/template.png" alt="" aria-hidden="true" />
        
        <div class="content">
            <div class="header-group">
                <div class="header-copy">
                    <h1>The ED creates a learning-design problem.</h1>
                    <h2>Emergency medicine is built around interruption, uncertainty, and time scarcity.<span class="evidence">[15, 23]</span></h2>
                </div>
            </div>

            <div class="visual-container">
                <svg width="1670" height="370" viewBox="0 0 1670 370" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="30" y1="228" x2="1638" y2="228" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
                    <text x="30" y="268" fill="#64748b" font-size="24" font-weight="600">Shift Start</text>
                    <text x="1502" y="268" fill="#64748b" font-size="24" font-weight="600">Shift End</text>

                    <rect x="30" y="138" width="188" height="90" rx="10" fill="#e2e8f0" />
                    <rect x="248" y="98" width="132" height="130" rx="10" fill="#e2e8f0" />
                    <rect x="410" y="154" width="286" height="74" rx="10" fill="#e2e8f0" />
                    <rect x="724" y="82" width="126" height="146" rx="10" fill="#dce6f2" />
                    <rect x="880" y="120" width="248" height="108" rx="10" fill="#e2e8f0" />
                    <rect x="1158" y="144" width="182" height="84" rx="10" fill="#e2e8f0" />
                    <rect x="1370" y="104" width="272" height="124" rx="10" fill="#dfe6f2" />

                    <g stroke="#c8102e" stroke-width="4" stroke-dasharray="8 6">
                        <line x1="230" y1="66" x2="230" y2="228" />
                        <line x1="392" y1="66" x2="392" y2="228" />
                        <line x1="706" y1="66" x2="706" y2="228" />
                        <line x1="862" y1="66" x2="862" y2="228" />
                        <line x1="1140" y1="66" x2="1140" y2="228" />
                        <line x1="1354" y1="66" x2="1354" y2="228" />
                    </g>

                    <g fill="#c8102e">
                        <polygon points="230,46 240,66 220,66" />
                        <polygon points="392,46 402,66 382,66" />
                        <polygon points="706,46 716,66 696,66" />
                        <polygon points="862,46 872,66 852,66" />
                        <polygon points="1140,46 1150,66 1130,66" />
                        <polygon points="1354,46 1364,66 1344,66" />
                    </g>
                    <text x="230" y="28" fill="#c8102e" font-size="19" font-weight="700" text-anchor="middle">Interruption</text>

                    <rect x="220" y="194" width="20" height="34" rx="4" fill="#004b87" />
                    <rect x="382" y="194" width="20" height="34" rx="4" fill="#004b87" />
                    <rect x="696" y="194" width="20" height="34" rx="4" fill="#004b87" />
                    <rect x="852" y="194" width="20" height="34" rx="4" fill="#004b87" />
                    <rect x="1130" y="194" width="20" height="34" rx="4" fill="#004b87" />

                    <path d="M 1140 298 L 1140 240" stroke="#004b87" stroke-width="2" />
                    <circle cx="1140" cy="240" r="4" fill="#004b87" />
                    <text x="1140" y="328" fill="#004b87" font-size="22" font-weight="600" text-anchor="middle">Micro-window (3 min)</text>

                    <rect x="450" y="22" width="504" height="280" rx="12" fill="rgba(15, 32, 64, 0.03)" stroke="#0f2040" stroke-width="4" stroke-dasharray="12 12" />
                    <rect x="614" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#0f2040" stroke-width="2" />
                    <text x="709" y="26" fill="#0f2040" font-size="19" font-weight="700" text-anchor="middle">STRUCTURAL MISMATCH</text>
                    <text x="702" y="286" fill="#0f2040" font-size="28" font-weight="600" text-anchor="middle">Traditional Didactic (45 min)</text>

                    <g transform="translate(30, 334)">
                        <rect x="0" y="0" width="24" height="24" rx="4" fill="#e2e8f0" />
                        <text x="36" y="18" fill="#4a5568" font-size="19">Clinical Load</text>

                        <rect x="178" y="0" width="24" height="24" rx="4" fill="#004b87" />
                        <text x="214" y="18" fill="#4a5568" font-size="19">Just-in-Time Learning</text>
                    </g>
                </svg>
            </div>

            <div class="core-message">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#004b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                The challenge is structural: <span>the learning format has to fit the work.</span>
            </div>
        </div>
    </div>
</body>
</html>
