<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>What to Do Monday Morning</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }
        .slide-container {
            position: relative;
            width: 1920px;
            height: 1080px;
        }
        .shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
        }
        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 2;
            padding: 140px 160px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            color: #001530;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
        }
        h2 {
            font-size: 40px;
            font-weight: 400;
            color: #4A5568;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .citation {
            font-size: 24px;
            color: #A0AEC0;
            vertical-align: super;
            margin-left: 12px;
            font-weight: 500;
        }
        .roadmap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 160px;
            position: relative;
            padding: 0 20px;
        }
        .track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 4px;
            background: #E2E8F0;
            transform: translateY(-50%);
            z-index: 1;
        }
        .track-arrow {
            position: absolute;
            top: 50%;
            right: -5px;
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 16px solid #E2E8F0;
            z-index: 1;
        }
        .step {
            width: 460px;
            height: 300px;
            background: #ffffff;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 42px 40px 36px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }
        .step::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
        }
        .step-1::before { background-color: #0055A4; }
        .step-2::before { background-color: #001530; }
        .step-3::before { background-color: #D52B1E; }
        
        .step-bg-number {
            position: absolute;
            bottom: -30px;
            right: 20px;
            font-size: 200px;
            font-weight: 900;
            color: #F7FAFC;
            z-index: 0;
            line-height: 1;
            letter-spacing: -5px;
        }
        .step-content {
            position: relative;
            z-index: 1;
        }
        .step-label {
            font-size: 32px;
            font-weight: 700;
            color: #001530;
            line-height: 1.15;
            margin-top: 18px;
            letter-spacing: -0.5px;
        }
        .step-copy {
            font-size: 20px;
            font-weight: 400;
            color: #5E6A79;
            line-height: 1.28;
            margin-top: 14px;
            max-width: 270px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <img class="shell" src="../../../../templates/saem-annual-meeting-template-v1/template.png" alt="" aria-hidden="true" />
        <div class="content-layer">
            <h1>What to do Monday morning.</h1>
            <h2>Start with one pilot, one audience, and one metric.<span class="citation">[2, 8, 15, 23]</span></h2>
            
            <div class="roadmap">
                <div class="track"></div>
                <div class="track-arrow"></div>
                
                <div class="step step-1">
                    <div class="step-bg-number">1</div>
                    <div class="step-content">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0055A4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <div class="step-label">pick one topic</div>
                        <div class="step-copy">Choose one high-yield complaint or decision.</div>
                    </div>
                </div>
                
                <div class="step step-2">
                    <div class="step-bg-number">2</div>
                    <div class="step-content">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#001530" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                        <div class="step-label">curate or build one unit</div>
                        <div class="step-copy">One case, one question, one takeaway.</div>
                    </div>
                </div>
                
                <div class="step step-3">
                    <div class="step-bg-number">3</div>
                    <div class="step-content">
                        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#D52B1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        <div class="step-label">measure one outcome</div>
                        <div class="step-copy">Track completion, recall, or practice change.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
