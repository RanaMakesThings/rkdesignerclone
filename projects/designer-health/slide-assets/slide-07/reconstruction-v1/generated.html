<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 7 Beat Reconstruction v1</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");

      :root {
        --bg: #ffffff;
        --ink: #11161d;
        --muted: #5f6975;
        --line: rgba(17, 22, 29, 0.72);
        --accent: #6c9490;
        --accent-strong: #24474a;
        --panel-shadow: 0 16px 40px rgba(19, 27, 35, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        font-family: "Montserrat", system-ui, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .figure {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% -2%, rgba(108, 148, 144, 0.12), transparent 34%),
          linear-gradient(180deg, #ffffff 0%, #faf9f6 100%);
      }

      .storyboard {
        position: absolute;
        inset: 118px 122px 116px;
      }

      .guide {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 94px;
      }

      .before-visit {
        position: absolute;
        top: 10px;
        left: 34px;
        width: 1118px;
        height: 34px;
      }

      .before-visit::before,
      .before-visit::after {
        content: "";
        position: absolute;
        top: 16px;
        height: 2px;
        background: var(--line);
      }

      .before-visit::before {
        left: 0;
        right: calc(50% + 98px);
      }

      .before-visit::after {
        left: calc(50% + 98px);
        right: 0;
      }

      .before-visit span,
      .visit-begins {
        font-size: 22px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      .before-visit span {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.96);
      }

      .visit-begins {
        position: absolute;
        top: 0;
        left: 1290px;
        width: 232px;
        text-align: center;
      }

      .threshold {
        position: absolute;
        top: 58px;
        left: 1408px;
        width: 4px;
        height: 332px;
        border-radius: 999px;
        background: rgba(108, 148, 144, 0.96);
        box-shadow: 0 0 0 4px rgba(108, 148, 144, 0.08);
      }

      .art-row {
        position: absolute;
        top: 104px;
        left: 0;
        right: 0;
        bottom: 184px;
        display: grid;
        grid-template-columns: 15fr 22fr 33fr 20fr;
        column-gap: 34px;
        align-items: end;
      }

      .art-frame {
        min-height: 0;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: end;
      }

      .art-frame img {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 100%;
        height: auto;
        filter: drop-shadow(0 10px 24px rgba(18, 24, 32, 0.06));
      }

      .art-frame--1 {
        padding-top: 34px;
      }

      .art-frame--3 {
        padding-bottom: 18px;
      }

      .beats {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: 15fr 22fr 33fr 20fr;
        column-gap: 34px;
      }

      .beat {
        padding-right: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.96) 12%, rgba(255, 255, 255, 0.99) 100%);
      }

      .beat h2 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.03;
        font-weight: 700;
        letter-spacing: -0.045em;
        color: var(--ink);
      }

      .beat p {
        margin: 0;
        font-size: 17px;
        line-height: 1.36;
        font-weight: 500;
        color: var(--muted);
      }

      .beat--hero h2 {
        color: var(--accent-strong);
      }
    </style>
  </head>
  <body>
    <main class="figure">
      <section class="storyboard">
        <div class="guide">
          <div class="before-visit"><span>Before visit</span></div>
          <div class="visit-begins">Visit begins</div>
        </div>
        <div class="threshold"></div>

        <div class="art-row">
          <div class="art-frame art-frame--1">
            <img src="file:///Users/kabeer/Code/rkdesignerclone/projects/designer-health/slide-assets/slide-07/storyboard-beat-01-invite/preview.png" alt="Invite panel" />
          </div>
          <div class="art-frame art-frame--2">
            <img src="file:///Users/kabeer/Code/rkdesignerclone/projects/designer-health/slide-assets/slide-07/storyboard-beat-02-adaptive-interview/preview.jpg" alt="Adaptive interview panel" />
          </div>
          <div class="art-frame art-frame--3">
            <img src="file:///Users/kabeer/Code/rkdesignerclone/projects/designer-health/slide-assets/slide-07/storyboard-beat-03-brief-prepared/preview.jpg" alt="Brief prepared panel" />
          </div>
          <div class="art-frame art-frame--4">
            <img src="file:///Users/kabeer/Code/rkdesignerclone/projects/designer-health/slide-assets/slide-07/storyboard-beat-04-clinician-prepared/preview.jpg" alt="Clinician prepared panel" />
          </div>
        </div>

        <div class="beats">
          <article class="beat">
            <h2>Invite sent</h2>
            <p>Patient receives secure pre-visit link.</p>
          </article>
          <article class="beat">
            <h2>Adaptive interview</h2>
            <p>Vox asks follow-up questions and captures the story.</p>
          </article>
          <article class="beat beat--hero">
            <h2>Brief prepared</h2>
            <p>Patient story becomes a clinician-ready handoff.</p>
          </article>
          <article class="beat">
            <h2>Clinician starts prepared</h2>
            <p>Sets up a more efficient visit.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
