<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vox Pitch Deck Slide</title>
    <style>
        /* Base Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            width: 1920px;
            height: 1080px;
            background-color: #EBEAE4; /* Subtle warm grey background */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Color Palette & Dimensions Variables */
        :root {
            --text-dark: #112A2A;
            --text-muted: #5A6B6B;
            --blue-main: #4A88C7;
            --blue-light: #9BBEE0; /* Represents the time to be saved */
            --grey-exam: #D0D4D9;
            --grey-dec: #A5AEB8;
            --green-new: #52827A;
            
            /* Perfect Integer Math for Layout */
            --timeline-w: 1628px;
            --gap: 22px;
            
            /* Protected Segments (Fixed Widths) */
            --exam-w: 55px;
            --dec-w: 88px;
            
            /* Variable Segments */
            --story-ai-w: 110px; 
            --time-saved: 55px;
            --story-current-w: calc(var(--story-ai-w) + var(--time-saved)); /* 165px */
            
            /* Visit Totals */
            --visit-current-w: calc(var(--story-current-w) + var(--exam-w) + var(--dec-w)); /* 308px */
            --visit-ai-w: calc(var(--story-ai-w) + var(--exam-w) + var(--dec-w)); /* 253px */
        }

        /* Main Slide Card */
        .slide-card {
            width: 1820px;
            height: 980px;
            background-color: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 24px 48px rgba(17, 42, 42, 0.08);
            padding: 80px 96px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Section */
        header {
            margin-bottom: 80px;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: -0.5px;
        }

        /* Legend */
        .legend {
            position: absolute;
            top: 80px;
            right: 96px;
            display: flex;
            gap: 32px;
            background: #F8F9FA;
            padding: 16px 24px;
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .swatch {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        /* Schedule Area */
        .schedule-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 60px;
        }

        .row-container {
            position: relative;
        }

        .row-label {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline {
            display: flex;
            width: var(--timeline-w);
            gap: var(--gap);
        }

        /* Visit Blocks */
        .visit {
            display: flex;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .visit.current { width: var(--visit-current-w); }
        .visit.ai { width: var(--visit-ai-w); }

        /* Segments */
        .segment { height: 100%; flex-shrink: 0; }
        
        .seg-exam { width: var(--exam-w); background-color: var(--grey-exam); }
        .seg-dec { width: var(--dec-w); background-color: var(--grey-dec); }
        
        /* Story Segment Logic */
        .seg-story { display: flex; height: 100%; }
        .seg-story-core { width: var(--story-ai-w); background-color: var(--blue-main); height: 100%; }
        .seg-story-saved { width: var(--time-saved); background-color: var(--blue-light); height: 100%; }

        /* New Visit Block */
        .visit.new-visit {
            width: var(--visit-ai-w);
            background-color: var(--green-new);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        /* Separator / Annotation Line */
        .separator {
            display: flex;
            align-items: center;
            gap: 24px;
            width: var(--timeline-w);
            margin: 20px 0;
        }

        .sep-line {
            flex-grow: 1;
            height: 1px;
            background-color: #D0D4D9;
        }

        .sep-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Specific Annotations */
        .annotation-bracket {
            position: absolute;
            top: -65px;
            left: 0;
            width: var(--visit-current-w);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bracket-svg {
            width: 100%;
            height: 12px;
            overflow: visible;
        }

        .bracket-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }
        
        .bracket-subtext {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
        }

        /* Connecting dashed lines to show alignment */
        .guide-lines {
            position: absolute;
            top: 80px; /* Bottom of current row */
            left: 0;
            width: var(--timeline-w);
            height: calc(100% + 60px); /* Span down to AI row */
            pointer-events: none;
            z-index: 0;
        }

        .guide-line {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            border-left: 1px dashed #C0C8C8;
        }

    </style>
</head>
<body>

    <div class="slide-card">
        
        <header>
            <h1>More efficient visits will increase supply.</h1>
            <h2>Small per-visit gains compound.</h2>
        </header>

        <div class="legend">
            <div class="legend-item">
                <div class="swatch" style="background: var(--blue-main);"></div>
                Story reconstruction
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: var(--grey-exam);"></div>
                Physical exam
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: var(--grey-dec);"></div>
                Decisions + counseling
            </div>
        </div>

        <div class="schedule-area">
            
            <!-- Current Schedule Row -->
            <div class="row-container">
                <div class="row-label">Current Schedule (5 visits)</div>
                
                <!-- Annotation on first visit -->
                <div class="annotation-bracket">
                    <svg class="bracket-svg" viewBox="0 0 308 12" preserveAspectRatio="none">
                        <path d="M0,12 L0,0 L308,0 L308,12" fill="none" stroke="#A5AEB8" stroke-width="1.5"/>
                        <line x1="165" y1="0" x2="165" y2="12" stroke="#A5AEB8" stroke-width="1.5"/>
                    </svg>
                    <div class="bracket-text">
                        Most variable minutes
                        <div class="bracket-subtext">Target for AI prep</div>
                    </div>
                </div>

                <div class="timeline">
                    <!-- Visit 1 -->
                    <div class="visit current">
                        <div class="seg-story">
                            <div class="seg-story-core"></div>
                            <div class="seg-story-saved"></div>
                        </div>
                        <div class="segment seg-exam"></div>
                        <div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 2 -->
                    <div class="visit current">
                        <div class="seg-story"><div class="seg-story-core"></div><div class="seg-story-saved"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 3 -->
                    <div class="visit current">
                        <div class="seg-story"><div class="seg-story-core"></div><div class="seg-story-saved"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 4 -->
                    <div class="visit current">
                        <div class="seg-story"><div class="seg-story-core"></div><div class="seg-story-saved"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 5 -->
                    <div class="visit current">
                        <div class="seg-story"><div class="seg-story-core"></div><div class="seg-story-saved"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                </div>
            </div>

            <!-- Separator -->
            <div class="separator">
                <div class="sep-line"></div>
                <div class="sep-text">Efficiency repeated across visits creates capacity</div>
                <div class="sep-line"></div>
            </div>

            <!-- AI Assisted Schedule Row -->
            <div class="row-container">
                <div class="row-label">AI-Assisted Schedule (6 visits)</div>
                
                <!-- Guide lines showing alignment -->
                <div class="guide-lines">
                    <!-- Line after AI Visit 5, showing it aligns perfectly with the start of the "saved" space -->
                    <svg width="100%" height="100%">
                        <!-- Math: 5 * (253 + 22) = 1375px. This is exactly where the 6th visit starts. -->
                        <!-- Current 5 visits end at 1628px. -->
                        <line x1="1353" y1="-60" x2="1353" y2="20" stroke="#A5AEB8" stroke-width="2" stroke-dasharray="6 6"/>
                        <path d="M1353,20 L1348,10 L1358,10 Z" fill="#A5AEB8"/>
                    </svg>
                </div>

                <div class="timeline">
                    <!-- Visit 1 (AI) -->
                    <div class="visit ai">
                        <div class="seg-story"><div class="seg-story-core"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 2 (AI) -->
                    <div class="visit ai">
                        <div class="seg-story"><div class="seg-story-core"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 3 (AI) -->
                    <div class="visit ai">
                        <div class="seg-story"><div class="seg-story-core"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 4 (AI) -->
                    <div class="visit ai">
                        <div class="seg-story"><div class="seg-story-core"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 5 (AI) -->
                    <div class="visit ai">
                        <div class="seg-story"><div class="seg-story-core"></div></div>
                        <div class="segment seg-exam"></div><div class="segment seg-dec"></div>
                    </div>
                    <!-- Visit 6 (New) -->
                    <div class="visit new-visit">
                        New visit
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
