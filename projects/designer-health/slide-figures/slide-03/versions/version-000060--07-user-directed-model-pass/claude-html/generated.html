<!DOCTYPE html>
<html lang="en">

  body {

  .top-section {
    flex-shrink: 0;
  }

  }

  .bracket-row {

  .bracket-area {

    align-items: flex-start;
    padding: 0 2px;
  }

  .bracket-line {
    display: flex;
    align-items: flex-start;
    width: 100%;
  }

  .bracket-svg {

  .bracket-text {

  .bracket-sub {
    font-size: 12px;
    font-weight: 500;
    color: #8a9490;
    line-height: 1.5;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 100%;
    height: 1px;
    background: #e0ddd8;
    margin: 32px 0 28px 0;
    flex-shrink: 0;
  }

  /* ── BOTTOM SECTION ── */
  .bottom-section {
    display: flex;
    flex: 1;
    gap: 0;
    align-items: stretch;
  }

  .bottom-left {

    justify-content: flex-start;
  }

  }

  }

    flex-shrink: 0;
    line-height: 1.3;
  }
