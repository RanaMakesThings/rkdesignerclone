<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Pitch Deck - Slide 5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #f8fafc;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .slide-container {
    width: 1280px;
    height: 720px;
    background-color: #ffffff;
    position: relative;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  /* Header */
  .header {
    position: absolute;
    top: 100px;
    left: 86px;
    width: 600px;
  }
  .header h1 {
    font-size: 44px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.02em;
  }

  /* SVG Canvas for precise positioning and drawing */
  .svg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Grouped Support Block */
  .support-block {
    position: absolute;
    top: 286px;
    left: 522px;
    width: 670px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 40px 48px;
    box-sizing: border-box;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  }

  .support-heading {
    font-size: 24px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 32px 0;
    letter-spacing: -0.01em;
  }

  .reason-item {
    margin-bottom: 28px;
  }
  .reason-item:last-child {
    margin-bottom: 0;
  }

  .reason-title {
    font-size: 20px;
    font-weight: 600;
    color: #0f172a;
    margin: 0 0 6px 0;
    letter-spacing: -0.01em;
  }

  .reason-desc {
    font-size: 18px;
    font-weight: 400;
    color: #475569;
    margin: 0;
    line-height: 1.4;
  }

</style>
</head>
<body>

<div class="slide-container">
  
  <div class="header">
    <h1>History is the cleanest place to reclaim minutes</h1>
  </div>

  <svg class="svg-layer" viewBox="0 0 1280 720">
    <defs>
      <clipPath id="bar-clip">
        <rect x="484" y="188" width="526" height="78" rx="8" />
      </clipPath>
    </defs>

    <!-- Source Bar (Quoted from Slide 3) -->
    <g>
      <!-- Ruler -->
      <g fill="#64748b" font-size="14" font-weight="500" text-anchor="middle">
        <text x="484" y="160">0</text>
        <line x1="484" y1="168" x2="484" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
        
        <line x1="536.6" y1="168" x2="536.6" y2="172" stroke="#cbd5e1" stroke-width="1" />
        <line x1="589.2" y1="168" x2="589.2" y2="172" stroke="#cbd5e1" stroke-width="1" />
        
        <text x="615.5" y="160">5</text>
        <line x1="615.5" y1="168" x2="615.5" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
        
        <line x1="668.1" y1="168" x2="668.1" y2="172" stroke="#cbd5e1" stroke-width="1" />
        <line x1="720.7" y1="168" x2="720.7" y2="172" stroke="#cbd5e1" stroke-width="1" />
        
        <text x="747" y="160">10</text>
        <line x1="747" y1="168" x2="747" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
        
        <line x1="799.6" y1="168" x2="799.6" y2="172" stroke="#cbd5e1" stroke-width="1" />
        <line x1="852.2" y1="168" x2="852.2" y2="172" stroke="#cbd5e1" stroke-width="1" />
        
        <text x="878.5" y="160">15</text>
        <line x1="878.5" y1="168" x2="878.5" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
        
        <line x1="931.1" y1="168" x2="931.1" y2="172" stroke="#cbd5e1" stroke-width="1" />
        <line x1="983.7" y1="168" x2="983.7" y2="172" stroke="#cbd5e1" stroke-width="1" />
        
        <text x="1010" y="160">20</text>
        <line x1="1010" y1="168" x2="1010" y2="174" stroke="#cbd5e1" stroke-width="1.5" />
      </g>

      <!-- Bar Segments -->
      <g clip-path="url(#bar-clip)">
        <!-- History Wedge -->
        <rect x="484" y="188" width="136" height="78" fill="#5b8bca" />
        <text x="552" y="232" fill="#ffffff" font-size="16" font-weight="500" text-anchor="middle">Story reconstruction</text>
        
        <!-- Decisions -->
        <rect x="620" y="188" width="174" height="78" fill="#94a3b8" />
        <text x="707" y="232" fill="#ffffff" font-size="16" font-weight="500" text-anchor="middle">Decisions + counseling</text>
        
        <!-- Exam -->
        <rect x="794" y="188" width="216" height="78" fill="#e2e8f0" />
        <text x="902" y="232" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">Exam + workflow</text>
      </g>
    </g>

    <!-- Connector Arrow -->
    <g>
      <path d="M 552 266 C 450 300, 213 400, 213 500" fill="none" stroke="#94a3b8" stroke-width="2" />
      <path d="M 203 480 L 213 500 L 223 480" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Hero Module -->
    <g>
      <rect x="66" y="506" width="294" height="138" rx="8" fill="#4a86c6" />
      <text x="213" y="582" fill="#ffffff" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="-0.01em">History reconstruction</text>
    </g>
  </svg>

  <!-- Grouped Support Block -->
  <div class="support-block">
    <h2 class="support-heading">Why this wedge</h2>
    
    <div class="reason-item">
      <h3 class="reason-title">Repeated across visits</h3>
      <p class="reason-desc">The same story gets repeated across encounters</p>
    </div>
    
    <div class="reason-item">
      <h3 class="reason-title">Time-variable</h3>
      <p class="reason-desc">Time required depends on complexity and communication</p>
    </div>
    
    <div class="reason-item">
      <h3 class="reason-title">Can begin before the encounter</h3>
      <p class="reason-desc">Much of it can happen before the clinician is on the clock</p>
    </div>
  </div>

</div>

</body>
</html>
