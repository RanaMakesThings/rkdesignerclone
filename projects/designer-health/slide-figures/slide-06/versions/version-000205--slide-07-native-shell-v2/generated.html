<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 7 Native Shell v2</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");

      :root {
        --bg: #ffffff;
        --ink: #11161d;
        --muted: #4f5b69;
        --line: rgba(17, 22, 29, 0.78);
        --accent: #6c9490;
        --chip: #646b74;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        font-family: "Montserrat", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .figure {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 3%, rgba(108, 148, 144, 0.08), transparent 30%),
          linear-gradient(180deg, #ffffff 0%, #fbfaf8 100%);
      }

      .storyboard {
        position: absolute;
        inset: 118px 92px 90px;
      }

      .guide {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 86px;
      }

      .before-visit {
        position: absolute;
        left: 8px;
        top: 12px;
        width: 1242px;
        height: 34px;
      }

      .before-visit::before,
      .before-visit::after {
        content: "";
        position: absolute;
        top: 17px;
        height: 2px;
        background: var(--line);
      }

      .before-visit::before {
        left: 0;
        right: calc(50% + 96px);
        border-top-left-radius: 18px;
      }

      .before-visit::after {
        left: calc(50% + 96px);
        right: 0;
        border-top-right-radius: 18px;
      }

      .before-visit .cap {
        position: absolute;
        top: 17px;
        width: 2px;
        height: 26px;
        background: var(--line);
      }

      .before-visit .cap--left {
        left: 0;
        border-radius: 999px 999px 0 0;
      }

      .before-visit .cap--right {
        right: 0;
        border-radius: 999px 999px 0 0;
      }

      .before-visit span,
      .visit-begins {
        font-size: 27px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: var(--ink);
      }

      .before-visit span {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.98);
      }

      .visit-begins {
        position: absolute;
        left: 1414px;
        top: 4px;
        width: 236px;
        text-align: center;
      }

      .art-stage {
        position: absolute;
        left: 0;
        top: 112px;
        width: 1736px;
        height: 332px;
      }

      .art-stage img {
        display: block;
        width: 100%;
        height: auto;
      }

      .threshold-overlay {
        position: absolute;
        left: 1282px;
        top: 112px;
        width: 5px;
        height: 366px;
        border-radius: 999px;
        background: rgba(108, 148, 144, 0.92);
      }

      .baseline {
        position: absolute;
        left: 0;
        top: 442px;
        width: 1736px;
        height: 84px;
        pointer-events: none;
      }

      .copy-row {
        position: absolute;
        left: 0;
        top: 516px;
        width: 1736px;
        height: 240px;
      }

      .beat {
        position: absolute;
      }

      .beat--1 {
        left: 0;
        width: 240px;
      }

      .beat--2 {
        left: 294px;
        width: 384px;
      }

      .beat--3 {
        left: 726px;
        width: 482px;
      }

      .beat--4 {
        left: 1452px;
        width: 284px;
      }

      .beat h2 {
        margin: 0 0 14px;
        font-size: 36px;
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: -0.065em;
        color: var(--ink);
      }

      .beat p {
        margin: 0;
        font-size: 22px;
        line-height: 1.24;
        font-weight: 500;
        letter-spacing: -0.035em;
        color: var(--ink);
      }

      .beat--3 h2 {
        color: #18393a;
      }

      .marker-label {
        font-size: 31px;
        font-weight: 700;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </head>
  <body>
    <main class="figure">
      <section class="storyboard">
        <div class="guide">
          <div class="before-visit">
            <i class="cap cap--left"></i>
            <span>Before visit</span>
            <i class="cap cap--right"></i>
          </div>
          <div class="visit-begins">Visit begins</div>
        </div>

        <div class="art-stage">
          <img src="./strip-clean.png" alt="Slide 7 cleaned storyboard strip" />
        </div>
        <div class="threshold-overlay" aria-hidden="true"></div>

        <svg class="baseline" viewBox="0 0 1736 84" preserveAspectRatio="none" aria-hidden="true">
          <line x1="2" y1="28" x2="1734" y2="28" stroke="rgba(17,22,29,0.86)" stroke-width="4" stroke-linecap="round" />

          <circle cx="115" cy="28" r="31" fill="#646b74" />
          <circle cx="410" cy="28" r="31" fill="#646b74" />
          <circle cx="806" cy="28" r="31" fill="#646b74" />
          <circle cx="1566" cy="28" r="31" fill="#646b74" />

          <text class="marker-label" x="115" y="32">1</text>
          <text class="marker-label" x="410" y="32">2</text>
          <text class="marker-label" x="806" y="32">3</text>
          <text class="marker-label" x="1566" y="32">4</text>
        </svg>

        <div class="copy-row">
          <article class="beat beat--1">
            <h2>Invite sent</h2>
            <p>Patient receives secure pre-visit link.</p>
          </article>

          <article class="beat beat--2">
            <h2>Adaptive interview</h2>
            <p>Vox asks follow-up questions and captures the story.</p>
          </article>

          <article class="beat beat--3">
            <h2>Brief prepared</h2>
            <p>Patient story becomes a clinician-ready handoff.</p>
          </article>

          <article class="beat beat--4">
            <h2>Clinician starts prepared</h2>
            <p>Sets up a more efficient visit.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
