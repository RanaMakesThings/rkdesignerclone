<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide 7 Manual Panels HTML v1</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap");

      :root {
        --bg: #ffffff;
        --text: #121821;
        --muted: #5d6876;
        --soft-line: rgba(24, 31, 40, 0.7);
        --accent: #6c9490;
        --hero: #224144;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Manrope", system-ui, sans-serif;
        color: var(--text);
      }

      .figure {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 4%, rgba(108, 148, 144, 0.08), transparent 33%),
          linear-gradient(180deg, #ffffff 0%, #fafaf8 100%);
      }

      .storyboard {
        position: absolute;
        inset: 108px 118px 98px;
      }

      .guide {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 76px;
      }

      .before-visit {
        position: absolute;
        top: 18px;
        left: 40px;
        width: 1110px;
        height: 32px;
      }

      .before-visit::before,
      .before-visit::after {
        content: "";
        position: absolute;
        top: 15px;
        height: 2px;
        background: var(--soft-line);
      }

      .before-visit::before {
        left: 0;
        right: calc(50% + 88px);
      }

      .before-visit::after {
        left: calc(50% + 88px);
        right: 0;
      }

      .before-visit span,
      .visit-begins {
        font-family: "Space Grotesk", "Manrope", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .before-visit span {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.98);
      }

      .visit-begins {
        position: absolute;
        top: 6px;
        left: 1294px;
        width: 206px;
        text-align: center;
      }

      .threshold {
        position: absolute;
        top: 78px;
        left: 1412px;
        width: 4px;
        height: 318px;
        border-radius: 999px;
        background: rgba(108, 148, 144, 0.95);
      }

      .art-row {
        position: absolute;
        top: 116px;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: 15fr 22fr 33fr 20fr;
        column-gap: 34px;
        align-items: end;
      }

      .art-frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      .art-frame--1 img {
        width: 100%;
      }

      .art-frame--2 img {
        width: 100%;
      }

      .art-frame--3 img {
        width: 100%;
      }

      .art-frame--4 img {
        width: 100%;
      }

      .beats {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: 15fr 22fr 33fr 20fr;
        column-gap: 34px;
      }

      .beat h2 {
        margin: 0 0 10px;
        font-family: "Space Grotesk", "Manrope", system-ui, sans-serif;
        font-size: 30px;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .beat p {
        margin: 0;
        font-size: 18px;
        line-height: 1.32;
        color: var(--muted);
      }

      .beat--hero h2 {
        color: var(--hero);
      }
    </style>
  </head>
  <body>
    <main class="figure">
      <section class="storyboard">
        <div class="guide">
          <div class="before-visit"><span>Before visit</span></div>
          <div class="visit-begins">Visit begins</div>
        </div>
        <div class="threshold"></div>

        <div class="art-row">
          <div class="art-frame art-frame--1">
            <img src="./beat1.png" alt="Invite panel" />
          </div>
          <div class="art-frame art-frame--2">
            <img src="./beat2.png" alt="Interview panel" />
          </div>
          <div class="art-frame art-frame--3">
            <img src="./beat3.png" alt="Brief panel" />
          </div>
          <div class="art-frame art-frame--4">
            <img src="./beat4.png" alt="Clinician panel" />
          </div>
        </div>

        <div class="beats">
          <article class="beat">
            <h2>Invite sent</h2>
            <p>Patient receives secure pre-visit link.</p>
          </article>
          <article class="beat">
            <h2>Adaptive interview</h2>
            <p>Vox asks follow-up questions and captures the story.</p>
          </article>
          <article class="beat beat--hero">
            <h2>Brief prepared</h2>
            <p>Patient story becomes a clinician-ready handoff.</p>
          </article>
          <article class="beat">
            <h2>Clinician starts prepared</h2>
            <p>Sets up a more efficient visit.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
