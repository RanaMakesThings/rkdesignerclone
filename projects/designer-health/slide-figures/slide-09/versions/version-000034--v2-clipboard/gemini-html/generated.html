<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vox Pitch Deck Slide</title>
    <style>
        :root {
            --bg-color: #eef0f2;
            --text-main: #18181b;
            --text-muted: #71717a;
            --text-sub: #52525b;
            --accent-blue: #1d4ed8;
            --label-gray: #a1a1aa;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333; /* Dark background outside the slide */
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background: radial-gradient(circle at 30% 20%, #ffffff, #e4e4e7);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* Typography */
        .header-group {
            position: absolute;
            top: 64px;
            left: 64px;
            z-index: 10;
            max-width: 850px;
        }

        h1 {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        h1 span.muted {
            color: var(--text-muted);
        }

        p.subheader {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-sub);
            max-width: 720px;
        }

        /* Peripheral Labels */
        .peripheral-label {
            position: absolute;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--label-gray);
            z-index: 5;
        }

        .label-scheduling { top: 64px; right: 64px; }
        .label-reminders { top: 360px; left: 64px; }
        .label-doc { bottom: 64px; left: 64px; }
        .label-note { bottom: 64px; right: 64px; }

        /* Center Label */
        .reasoning-label {
            position: absolute;
            top: 320px;
            left: 860px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 16px;
            font-style: italic;
            color: var(--text-sub);
            z-index: 10;
        }

        .reasoning-label::before {
            content: '';
            display: block;
            width: 48px;
            height: 1px;
            background-color: var(--label-gray);
        }

        /* SVG Background Layer */
        .svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        
        <!-- Header & Subheader -->
        <div class="header-group">
            <h1><span class="muted">Current AI helps around the visit.</span><br>Vox changes how the visit starts.</h1>
            <p class="subheader">Most assistive AI reduces operational or documentation work. Vox gives the clinician a structured brief at the beginning of the visit.</p>
        </div>

        <!-- Peripheral Support Labels -->
        <div class="peripheral-label label-scheduling">scheduling</div>
        <div class="peripheral-label label-reminders">reminders</div>
        <div class="peripheral-label label-doc">documentation support</div>
        <div class="peripheral-label label-note">note generation</div>

        <!-- Center Label -->
        <div class="reasoning-label">Where clinical reasoning begins</div>

        <!-- Documentary Context Layer (SVG) -->
        <svg class="svg-layer" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Shadows & Filters -->
                <filter id="board-shadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="8" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.15"/>
                </filter>
                <filter id="paper-shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
                </filter>
                <filter id="brief-shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
                </filter>
                <filter id="heavy-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="24"/>
                </filter>

                <!-- Gradients -->
                <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#f8f8fa"/>
                </linearGradient>
                <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2563eb"/>
                    <stop offset="100%" stop-color="#1e40af"/>
                </linearGradient>
            </defs>

            <!-- Central Clipboard Group (Rotated for natural feel) -->
            <g transform="translate(620, 480) rotate(8)">
                
                <!-- Clipboard Base -->
                <rect x="-240" y="-340" width="480" height="660" rx="16" fill="#a1a1aa" filter="url(#board-shadow)"/>
                
                <!-- Metal Clip -->
                <rect x="-70" y="-330" width="140" height="40" rx="4" fill="#71717a"/>
                <circle cx="0" cy="-310" r="6" fill="#52525b"/>
                
                <!-- Paper -->
                <rect x="-220" y="-270" width="440" height="570" fill="url(#paper-grad)" filter="url(#paper-shadow)"/>
                
                <!-- Empty Form Lines (Context) -->
                <line x1="-180" y1="20" x2="180" y2="20" stroke="#e4e4e7" stroke-width="2"/>
                <line x1="-180" y1="50" x2="180" y2="50" stroke="#e4e4e7" stroke-width="2"/>
                <line x1="-180" y1="80" x2="180" y2="80" stroke="#e4e4e7" stroke-width="2"/>
                <line x1="-180" y1="110" x2="60" y2="110" stroke="#e4e4e7" stroke-width="2"/>
                <line x1="-180" y1="140" x2="180" y2="140" stroke="#e4e4e7" stroke-width="2"/>
                <line x1="-180" y1="170" x2="120" y2="170" stroke="#e4e4e7" stroke-width="2"/>

                <!-- Vox Structured Brief (The Blue Accent) -->
                <g transform="translate(0, -140)">
                    <!-- Brief Background -->
                    <rect x="-190" y="-100" width="380" height="200" rx="8" fill="url(#blue-grad)" filter="url(#brief-shadow)"/>
                    
                    <!-- Brief Header -->
                    <text x="-155" y="-55" fill="#ffffff" font-size="20" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" letter-spacing="0.02em">Vox-prepared brief</text>
                    
                    <!-- Row 1: What matters -->
                    <rect x="-155" y="-30" width="310" height="32" rx="4" fill="rgba(255,255,255,0.12)"/>
                    <circle cx="-135" cy="-14" r="4" fill="#93c5fd"/>
                    <text x="-115" y="-9" fill="#ffffff" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">What matters</text>

                    <!-- Row 2: What happened when -->
                    <rect x="-155" y="10" width="310" height="32" rx="4" fill="rgba(255,255,255,0.12)"/>
                    <circle cx="-135" cy="26" r="4" fill="#93c5fd"/>
                    <text x="-115" y="31" fill="#ffffff" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">What happened when</text>

                    <!-- Row 3: What still needs confirmation -->
                    <rect x="-155" y="50" width="310" height="32" rx="4" fill="rgba(255,255,255,0.12)"/>
                    <circle cx="-135" cy="66" r="4" fill="#93c5fd"/>
                    <text x="-115" y="71" fill="#ffffff" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">What still needs confirmation</text>
                </g>
            </g>

            <!-- Foreground Blurred Hands (Documentary Depth of Field) -->
            <!-- Left Hand (Thumb holding edge) -->
            <path d="M 320,420 Q 400,400 420,480 Q 440,580 340,650 Z" fill="#a8a29e" filter="url(#heavy-blur)" opacity="0.85"/>
            
            <!-- Right Hand (Supporting bottom edge) -->
            <path d="M 780,750 Q 820,620 920,640 Q 1000,660 980,750 Z" fill="#a8a29e" filter="url(#heavy-blur)" opacity="0.85"/>
        </svg>

    </div>

</body>
</html>
