<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Deck – Slide 09</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #faf9f7;
    font-family: 'Montserrat', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }

  .slide {
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    padding: 72px 96px 68px 96px;
    background: #faf9f7;
    position: relative;
  }

  /* Subtle warm texture overlay */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 0%, rgba(245,243,238,0.7) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(240,238,234,0.5) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ── HEADER ── */
  .header {
    margin-bottom: 52px;
    flex-shrink: 0;
  }

  .header-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b0a99a;
    margin-bottom: 14px;
  }

  .header-title {
    font-size: 44px;
    font-weight: 700;
    color: #1a1916;
    line-height: 1.18;
    letter-spacing: -0.02em;
    max-width: 1000px;
  }

  .header-title em {
    font-style: normal;
    color: #3a3730;
  }

  /* ── CARD ROW ── */
  .card-row {
    display: flex;
    gap: 28px;
    flex: 1;
    min-height: 0;
  }

  /* ── CARD ── */
  .card {
    flex: 1;
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid rgba(0,0,0,0.065);
    box-shadow:
      0 2px 8px rgba(0,0,0,0.04),
      0 8px 32px rgba(0,0,0,0.06),
      inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .card-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 40px 44px 40px 44px;
  }

  /* ── KICKER ── */
  .kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a09890;
    margin-bottom: 22px;
    flex-shrink: 0;
  }

  /* ── IMAGE WRAPPER ── */
  .image-wrapper {
    width: 100%;
    flex: 1;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: #f2f0ec;
    margin-bottom: 28px;
    position: relative;
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  /* ── SUPPORT LINE ── */
  .support-line {
    font-size: 15px;
    font-weight: 400;
    color: #4a4740;
    line-height: 1.6;
    letter-spacing: 0.005em;
    margin-bottom: 22px;
    flex-shrink: 0;
    max-width: 560px;
  }

  .support-line strong {
    font-weight: 600;
    color: #1a1916;
  }

  /* ── CHIP FIELD ── */
  .chip-field {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    flex-shrink: 0;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 14px;
    border-radius: 100px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .chip-gray {
    background: #f0ede8;
    color: #7a7570;
    border: 1px solid rgba(0,0,0,0.07);
  }

  .chip-blue {
    background: #1a5fff;
    color: #ffffff;
    border: 1px solid transparent;
    box-shadow: 0 2px 12px rgba(26,95,255,0.28);
    letter-spacing: 0.08em;
  }

  .chip-outline {
    background: transparent;
    color: #c8c2ba;
