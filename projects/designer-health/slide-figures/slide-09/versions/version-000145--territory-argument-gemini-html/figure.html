<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Deck Slide</title>
<style>
  :root {
    --bg-color: #FDFCFB;
    --text-primary: #111111;
    --text-secondary: #555555;
    --text-tertiary: #888888;
    --accent-blue: #0055FF;
    --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1920px;
    height: 1080px;
    background-color: var(--bg-color);
    font-family: var(--font-family);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 90px 120px;
  }

  /* Top 20-22% Headline Area */
  .header-area {
    height: 22%;
    display: flex;
    align-items: flex-start;
  }

  .headline {
    font-size: 64px;
    font-weight: 500;
    line-height: 1.1;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    max-width: 1600px;
  }

  /* Bottom Two-Column Area */
  .content-area {
    flex: 1;
    display: grid;
    grid-template-columns: 43fr 57fr;
    gap: 120px;
    padding-top: 10px;
  }

  .column {
    display: flex;
    flex-direction: column;
  }

  .kicker {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 24px;
  }

  .statement {
    font-size: 52px;
    line-height: 1.15;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 56px;
    letter-spacing: -0.01em;
    /* Ensuring statement is the dominant element */
    flex-shrink: 0; 
  }

  .image-container {
    height: 280px; /* Constrained height so image acts as smaller evidence */
    margin-bottom: 48px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .image-container img {
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: left top;
    /* Subtle wash/reduced contrast for editorial feel */
    filter: grayscale(85%) sepia(5%) opacity(0.85) contrast(0.95);
  }

  .density-section {
    margin-top: auto; /* Pushes density marker to the bottom if needed, though flow is natural */
    display: flex;
    flex-direction: column;
  }

  .density-caption {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .density-marker {
    display: flex;
    align-items: center;
    height: 24px;
  }
</style>
</head>
<body>

  <div class="header-area">
    <h1 class="headline">AI has traction after the visit. The visit itself is still thinly served.</h1>
  </div>

  <div class="content-area">
    
    <!-- Left Column: ~43% -->
    <div class="column left-column">
      <div class="kicker">AI impact after the visit</div>
      <div class="statement">Ambient scribes validate clinician buy-in for AI assistance.</div>
      
      <div class="image-container">
        <img src="/Users/kabeer/Desktop/4FAA88B9-3C54-4321-B182-C8DB4ED0A963.png" alt="Clinician at computer">
      </div>
      
      <div class="density-section">
        <div class="density-caption">More crowded</div>
        <div class="density-marker">
          <!-- Compact cluster of small gray nodes -->
          <svg width="64" height="24" viewBox="0 0 64 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="12" r="4" fill="#A3A3A3"/>
            <circle cx="18" cy="7" r="3" fill="#C2C2C2"/>
            <circle cx="22" cy="16" r="4.5" fill="#8A8A8A"/>
            <circle cx="34" cy="11" r="5" fill="#B0B0B0"/>
            <circle cx="44" cy="8" r="3.5" fill="#D1D1D1"/>
            <circle cx="48" cy="17" r="4" fill="#999999"/>
            <circle cx="58" cy="13" r="3" fill="#B8B8B8"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Right Column: ~57% (Slightly more important) -->
    <div class="column right-column">
      <div class="kicker">AI impact during the visit</div>
      <div class="statement">Few tools actually change how the encounter is conducted. Vox does.</div>
      
      <div class="image-container">
        <img src="/Users/kabeer/Desktop/757B1C3E-6121-4432-8524-C7BDE4EE6722.png" alt="Clinician with patient">
      </div>
      
      <div class="density-section">
        <div class="density-caption">Still thin</div>
        <div class="density-marker">
          <!-- One blue VOX marker + faint outline markers with whitespace -->
          <svg width="160" height="24" viewBox="0 0 160 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="6" fill="#0055FF"/>
            <circle cx="90" cy="12" r="5" stroke="#D4D4D4" stroke-width="1.5"/>
            <circle cx="140" cy="12" r="4" stroke="#E5E5E5" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
