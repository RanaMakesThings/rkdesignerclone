<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vox Market Opportunity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex flex-col items-center justify-center min-h-screen font-sans antialiased">

    <!-- Presentation Slide - Fixed 16:9 Aspect Ratio (1280x720) -->
    <div class="w-[1280px] h-[720px] bg-white shadow-2xl rounded-xl flex flex-col relative overflow-hidden ring-1 ring-slate-900/5 p-16">
        
        <!-- Header -->
        <h1 class="text-[44px] font-bold tracking-tight text-slate-900 mb-14 max-w-[95%] leading-[1.15]">
            Vox enters a relatively open market: AI that impacts the visit itself.
        </h1>

        <!-- Panels Container -->
        <div class="grid grid-cols-2 gap-10 flex-1 relative mb-6">
            
            <!-- Left Panel: VOX -->
            <div class="relative rounded-[32px] bg-gradient-to-b from-[#f4f7fc] to-[#eef3fb] border border-blue-200 flex flex-col shadow-md">
                
                <!-- Top Banner -->
                <div class="bg-blue-600 border-b border-blue-700 px-10 py-6 rounded-t-[31px]">
                    <h2 class="text-[28px] text-white font-extrabold tracking-widest uppercase shadow-sm">
                        VOX
                    </h2>
                </div>
                
                <!-- Content Container -->
                <div class="p-10 pt-8 flex-1 flex flex-col">
                    <!-- Body Text -->
                    <div class="text-slate-700 text-[26px] font-medium leading-[1.6] flex-1 max-w-[95%] z-10 mt-2">
                        <p>Tools built for the <span class="text-blue-900 font-bold">visit itself</span> remain <span class="text-blue-900 font-bold">sparse</span>.</p>
                    </div>

                    <!-- Bottom Text -->
                    <div class="mt-auto pt-8 pr-64 relative z-10">
                        <div class="w-10 h-1.5 bg-blue-500 rounded-full mb-5"></div>
                        <div class="text-[26px] leading-tight font-bold text-blue-950 tracking-tight">
                            Primarily impacts<br />the visit
                        </div>
                    </div>
                </div>

                <!-- Floating Thumbnail -->
                <div class="absolute -bottom-6 right-8 w-60 h-44 rounded-2xl overflow-hidden shadow-[0_12px_36px_rgba(0,0,0,0.12)] border-[6px] border-white z-20 bg-[#f4f7fc] flex items-center justify-center">
                    <!-- Dynamic Wave/Encounter SVG Graphic -->
                    <svg width="80" height="80" viewBox="0 0 84 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="opacity-80">
                        <rect x="38" y="12" width="8" height="40" rx="4" fill="#3b82f6"/>
                        <rect x="22" y="24" width="8" height="16" rx="4" fill="#93c5fd"/>
                        <rect x="54" y="20" width="8" height="24" rx="4" fill="#60a5fa"/>
                        <rect x="6" y="28" width="8" height="8" rx="4" fill="#bfdbfe"/>
                        <rect x="70" y="26" width="8" height="12" rx="4" fill="#bfdbfe"/>
                    </svg>
                </div>
            </div>

            <!-- Right Panel: Documentation AI -->
            <div class="relative rounded-[32px] bg-gradient-to-b from-slate-50 to-slate-100/60 border border-slate-200 flex flex-col shadow-sm">
                
                <!-- Top Banner -->
                <div class="bg-slate-200/80 border-b border-slate-300 px-10 py-6 rounded-t-[31px]">
                    <h2 class="text-[22px] text-slate-800 font-extrabold tracking-wide uppercase">
                        Ambient scribe &bull; Documentation AI
                    </h2>
                </div>
                
                <!-- Content Container -->
                <div class="p-10 pt-8 flex-1 flex flex-col">
                    <!-- Body Text -->
                    <div class="text-slate-600 text-[26px] font-medium leading-[1.6] flex-1 max-w-[95%] z-10 mt-2">
                        <p class="mb-8">Clinician buy-in is <span class="text-slate-900 font-bold">already real</span>.</p>
                        <p>Competition has <span class="text-slate-900 font-bold">clustered here</span>.</p>
                    </div>

                    <!-- Bottom Text -->
                    <div class="mt-auto pt-8 pr-64 relative z-10">
                        <div class="w-10 h-1.5 bg-slate-300 rounded-full mb-5"></div>
                        <div class="text-[26px] leading-tight font-bold text-slate-800 tracking-tight">
                            Primarily impacts<br />the record
                        </div>
                    </div>
                </div>

                <!-- Floating Thumbnail (Contained properly by sitting -6 bottom inside the slide's 16 padding) -->
                <div class="absolute -bottom-6 right-8 w-60 h-44 rounded-2xl overflow-hidden shadow-[0_12px_36px_rgba(0,0,0,0.12)] border-[6px] border-white z-20 bg-slate-100 flex items-center justify-center">
                    <!-- Layered Document SVG Graphic -->
                    <svg width="80" height="80" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="opacity-50">
                        <rect x="20" y="12" width="28" height="36" rx="2" stroke="#475569" stroke-width="3" fill="#f8fafc"/>
                        <path d="M26 22H42" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                        <path d="M26 30H42" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                        <path d="M26 38H36" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
                        <rect x="14" y="18" width="28" height="36" rx="2" stroke="#94a3b8" stroke-width="3" fill="transparent" stroke-dasharray="4 4"/>
                    </svg>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
