<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Deck Slide - Capacity Economics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6B7280;
            --text-quiet: #9CA3AF;
            --accent-green: #059669;
            --accent-green-light: #ECFDF5;
            --border-color: #E5E7EB;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6; /* Outer background for viewing */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-color);
            position: relative;
            box-sizing: border-box;
            padding: 64px 80px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        /* Header Section */
        header {
            margin-bottom: 72px;
        }

        h1 {
            font-size: 44px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 12px 0;
            letter-spacing: -0.02em;
        }

        .subheader {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-muted);
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* Main Content Grid */
        .content-grid {
            display: flex;
            flex: 1;
            align-items: center;
            gap: 80px;
            margin-bottom: 40px;
        }

        /* Left: Dominant Threshold Object */
        .threshold-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .accent-bar {
            width: 48px;
            height: 4px;
            background-color: var(--accent-green);
            margin-bottom: 32px;
            border-radius: 2px;
        }

        .threshold-value {
            font-size: 140px;
            font-weight: 300;
            color: var(--text-main);
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
            display: flex;
            align-items: baseline;
        }

        .range-check {
            font-size: 64px;
            color: var(--text-quiet);
            font-weight: 300;
            margin-right: 8px;
            transform: translateY(-16px);
        }

        .threshold-label {
            font-size: 28px;
            font-weight: 400;
            color: var(--text-muted);
            line-height: 1.3;
            max-width: 400px;
        }

        /* Right: Annual Capacity Story */
        .story-section {
            flex: 1;
            padding-left: 64px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logic-flow {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        /* Connecting Line */
        .logic-flow::before {
            content: '';
            position: absolute;
            left: 23px;
            top: 40px;
            bottom: 40px;
            width: 2px;
            background-color: var(--accent-green-light);
            z-index: 1;
        }

        .logic-node {
            position: relative;
            padding-left: 72px;
            z-index: 2;
        }

        .node-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background-color: var(--bg-color);
            border: 2px solid var(--accent-green-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .node-icon svg {
            width: 20px;
            height: 20px;
            color: var(--accent-green);
        }

        .node-icon.solid {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .node-icon.solid svg {
            color: var(--bg-color);
        }

        .node-text {
            font-size: 36px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .node-text.highlight {
            font-size: 48px;
            font-weight: 600;
            color: var(--accent-green);
            letter-spacing: -0.02em;
        }

        /* Footer: Quiet Assumptions */
        footer {
            position: absolute;
            bottom: 48px;
            left: 80px;
            right: 80px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .assumptions {
            font-size: 14px;
            color: var(--text-quiet);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 16px;
            letter-spacing: 0.01em;
        }

        .dot {
            width: 4px;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="slide-container">
        
        <header>
            <h1>Recovered visit time creates real capacity.</h1>
            <p class="subheader">When recovered minutes become completed visits, the impact is meaningful.</p>
        </header>

        <div class="content-grid">
            
            <!-- Dominant Threshold Object -->
            <div class="threshold-section">
                <div class="accent-bar"></div>
                <div class="threshold-value">
                    <span class="range-check">~</span>$917
                </div>
                <div class="threshold-label">
                    / month break-even spend / provider
                </div>
            </div>

            <!-- Annual Capacity Story -->
            <div class="story-section">
                <div class="logic-flow">
                    
                    <div class="logic-node">
                        <div class="node-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        <div class="node-text">
                            +1 visit / provider / day
                        </div>
                    </div>

                    <div class="logic-node">
                        <div class="node-icon solid">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                        </div>
                        <div class="node-text highlight">
                            $11,000 / year
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <!-- Quiet Assumptions -->
        <footer>
            <div class="assumptions">
                <span>220 clinic days</span>
                <span class="dot"></span>
                <span>$125 / visit</span>
                <span class="dot"></span>
                <span>40% contribution margin</span>
            </div>
        </footer>

    </div>

</body>
</html>
