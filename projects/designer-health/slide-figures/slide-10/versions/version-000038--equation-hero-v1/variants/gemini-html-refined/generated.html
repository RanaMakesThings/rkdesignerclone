<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recovered Visit Time Capacity</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #0B1121;
            --text-muted: #64748B;
            --accent-color: #0D7F6C;
            --accent-bg: #E6F5F2;
            --border-light: #E2E8F0;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: #1E1E1E; /* Dark background for presentation framing */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            padding: 80px 100px;
            position: relative;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            margin-bottom: 70px;
        }

        h1.slide-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }

        p.slide-subtitle {
            font-size: 22px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Hero Object Styles */
        .hero-card {
            background-color: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 60px 70px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            position: relative;
            flex-grow: 1;
            justify-content: center;
        }

        .equation-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 40px;
            margin-top: -20px; /* Slight visual adjustment upward */
        }

        /* Input Section */
        .input-group {
            display: flex;
            flex-direction: column;
            min-width: 160px;
        }

        .input-value {
            font-size: 46px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .input-label {
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Connectors */
        .connector {
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .connector svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.5;
        }

        .connector.equals {
            font-size: 32px;
            font-weight: 300;
            color: #94A3B8;
            margin: 0 10px;
        }

        /* Assumptions Section */
        .assumptions-group {
            border-left: 1px solid var(--border-light);
            padding-left: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 180px;
        }

        .assumption-item {
            font-size: 17px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            line-height: 1.3;
        }

        .assumption-item::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 4px;
            background-color: #CBD5E1;
            border-radius: 50%;
            margin-right: 12px;
            margin-top: 9px;
            flex-shrink: 0;
        }

        .assumption-item span {
            display: block;
        }

        /* Output Section */
        .output-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 20px;
        }

        .hero-number-wrapper {
            display: flex;
            align-items: baseline;
            margin-bottom: 16px;
        }

        .hero-number {
            font-size: 110px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .hero-label {
            font-size: 24px;
            color: var(--text-muted);
            margin-left: 12px;
            font-weight: 500;
        }

        /* Break-even Pill */
        .break-even-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--accent-bg);
            color: var(--accent-color);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            gap: 8px;
        }

        .break-even-pill svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
        }

        /* Sensitivity Section */
        .sensitivity-control {
            position: absolute;
            bottom: 24px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sensitivity-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94A3B8;
            font-weight: 600;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100px;
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: 2px;
            background-color: var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slider-track::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 50%;
            background-color: var(--accent-color);
            z-index: 1;
        }

        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #CBD5E1;
            position: relative;
            z-index: 2;
        }

        .slider-dot.active {
            background-color: var(--accent-color);
            width: 8px;
            height: 8px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            width: 120px;
            font-size: 10px;
            color: #94A3B8;
            font-weight: 500;
        }

        .slider-labels span {
            width: 33.33%;
            text-align: center;
        }

        .slider-labels span.active {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <header>
            <h1 class="slide-title">Recovered visit time creates real capacity.</h1>
            <p class="slide-subtitle">When recovered minutes become completed visits, the impact is meaningful.</p>
        </header>

        <div class="hero-card">
            <div class="equation-wrapper">
                
                <!-- Input -->
                <div class="input-group">
                    <div class="input-value">+1 visit</div>
                    <div class="input-label">/ provider / day</div>
                </div>

                <!-- Arrow -->
                <div class="connector">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </div>

                <!-- Assumptions -->
                <div class="assumptions-group">
                    <div class="assumption-item">220 clinic days</div>
                    <div class="assumption-item">$125 / visit</div>
                    <div class="assumption-item">
                        <span>40%<br>contribution margin</span>
                    </div>
                </div>

                <!-- Equals -->
                <div class="connector equals">=</div>

                <!-- Output -->
                <div class="output-group">
                    <div class="hero-number-wrapper">
                        <div class="hero-number">$11,000</div>
                        <div class="hero-label">/ year</div>
                    </div>
                    <div class="break-even-pill">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 16 16 12 12 8"></polyline>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        ~$917 / month break-even spend / provider
                    </div>
                </div>

            </div>

            <!-- Sensitivity Control -->
            <div class="sensitivity-control">
                <span class="sensitivity-label">Sensitivity</span>
                <div class="slider-wrapper">
                    <div class="slider-track">
                        <div class="slider-dot"></div>
                        <div class="slider-dot active"></div>
                        <div class="slider-dot"></div>
                    </div>
                    <div class="slider-labels">
                        <span>Cons.</span>
                        <span class="active">Base</span>
                        <span>Upside</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
