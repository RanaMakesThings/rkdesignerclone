<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Designer Deck Template v1</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap");

      :root {
        --ink: #111111;
        --muted: #6f7785;
        --line: rgba(0, 0, 0, 0.9);
        --stub-line: rgba(17, 17, 17, 0.12);
        --stub-fill: rgba(17, 17, 17, 0.03);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: "Montserrat", sans-serif;
        color: var(--ink);
      }

      .slide {
        position: relative;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }

      .header {
        position: absolute;
        left: 92px;
        top: 62px;
        margin: 0;
        font-size: 64px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.05em;
      }

      .subheader {
        position: absolute;
        left: 92px;
        top: 154px;
        margin: 0;
        font-size: 27px;
        line-height: 1.28;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--muted);
      }

      .figure-stub {
        position: absolute;
        left: 182px;
        top: 250px;
        width: 1296px;
        height: 566px;
        border: 3px dashed var(--stub-line);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(17, 17, 17, 0.015) 0%, rgba(17, 17, 17, 0.04) 100%);
      }

      .figure-stub::before,
      .figure-stub::after {
        content: "";
        position: absolute;
        background: var(--stub-line);
      }

      .figure-stub::before {
        left: 50%;
        top: 0;
        width: 1px;
        height: 100%;
        transform: translateX(-0.5px);
      }

      .figure-stub::after {
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        transform: translateY(-0.5px);
      }

      .stub-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(17, 17, 17, 0.08);
        font-size: 21px;
        line-height: 1.2;
        font-weight: 600;
        color: var(--muted);
      }

      .footer-line {
        position: absolute;
        left: 112px;
        top: 992px;
        width: 1536px;
        height: 1px;
        background: var(--line);
      }

      .footer-logo {
        position: absolute;
        left: 1692px;
        top: 962px;
        width: 114px;
        height: 59px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <section class="slide" aria-label="Designer blank slide template">
      <h1 class="header">Header</h1>
      <p class="subheader">Subheader</p>
      <div class="figure-stub" aria-label="Graphic placeholder">
        <div class="stub-label">Graphic / Figure</div>
      </div>
      <div class="footer-line" aria-hidden="true"></div>
      <img
        class="footer-logo"
        src="../../../../assets/logo/designer-health-logo-black.svg"
        alt=""
        aria-hidden="true"
      />
    </section>
  </body>
</html>
