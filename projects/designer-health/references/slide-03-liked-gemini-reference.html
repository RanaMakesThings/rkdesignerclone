<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Ribbon Pitch Deck Figure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }

        .bg-hero-blue { background-color: #4A89C8; }
        .bg-hero-med-gray { background-color: #97A0AA; }
        .bg-hero-light-gray { background-color: #D9DEE3; }
        .bg-new-dark-green { background-color: #4F7C78; }
        .text-charcoal { color: #1F2937; }

        .visit-bar { transition: transform 0.2s ease-in-out; }
        .visit-bar:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-8 antialiased">
    <div class="w-full max-w-[1200px] bg-white text-charcoal flex flex-col justify-center">
        <div class="relative w-full">
            <div class="relative w-full h-10 mb-2 text-gray-500 font-medium text-sm">
                <div class="absolute left-[0%] flex flex-col items-center -translate-x-1/2 bottom-0"><span class="mb-1">0</span><div class="w-px h-2 bg-gray-400"></div></div>
                <div class="absolute left-[5%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[10%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[15%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[20%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[25%] flex flex-col items-center -translate-x-1/2 bottom-0"><span class="mb-1">5</span><div class="w-px h-2 bg-gray-400"></div></div>
                <div class="absolute left-[30%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[35%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[40%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[45%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[50%] flex flex-col items-center -translate-x-1/2 bottom-0"><span class="mb-1">10</span><div class="w-px h-2 bg-gray-400"></div></div>
                <div class="absolute left-[55%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[60%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[65%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[70%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[75%] flex flex-col items-center -translate-x-1/2 bottom-0"><span class="mb-1">15</span><div class="w-px h-2 bg-gray-400"></div></div>
                <div class="absolute left-[80%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[85%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[90%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[95%] bottom-0 h-1 w-px bg-gray-300"></div>
                <div class="absolute left-[100%] flex flex-col items-center -translate-x-1/2 bottom-0"><span class="mb-1">20</span><div class="w-px h-2 bg-gray-400"></div></div>
            </div>

            <div class="flex h-16 w-full rounded-md overflow-hidden text-white font-medium text-[17px] text-center shadow-sm">
                <div class="bg-hero-blue flex items-center justify-center" style="width: 33.33%;">
                    Story reconstruction
                </div>
                <div class="bg-hero-med-gray flex items-center justify-center" style="width: 33.33%;">
                    Decisions + counseling
                </div>
                <div class="bg-hero-light-gray text-charcoal flex items-center justify-center" style="width: 33.34%;">
                    Exam + workflow
                </div>
            </div>

            <div class="relative w-full pt-1">
                <div class="flex flex-col items-center relative z-10" style="width: 33.33%;">
                    <div class="w-[85%] h-2.5 border-b border-l border-r border-gray-400"></div>
                    <div class="w-px h-5 bg-gray-400"></div>
                    <div class="pt-2 text-center w-[120%]">
                        <p class="font-bold text-gray-900 text-[16px] leading-tight mb-1">Most variable minutes of the visit</p>
                        <p class="text-gray-700 text-[15px] leading-tight mb-1">Best target for upstream prep without losing quality</p>
                        <p class="text-gray-700 text-[15px] leading-tight">The part AI can help most</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full flex flex-col mt-16">
            <div class="flex gap-4 w-full">
                <div class="flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 33.33%"></div>
                    <div class="bg-hero-med-gray" style="width: 33.33%"></div>
                    <div class="bg-hero-light-gray" style="width: 33.34%"></div>
                </div>
                <div class="flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 33.33%"></div>
                    <div class="bg-hero-med-gray" style="width: 33.33%"></div>
                    <div class="bg-hero-light-gray" style="width: 33.34%"></div>
                </div>
                <div class="flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 33.33%"></div>
                    <div class="bg-hero-med-gray" style="width: 33.33%"></div>
                    <div class="bg-hero-light-gray" style="width: 33.34%"></div>
                </div>
                <div class="flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 33.33%"></div>
                    <div class="bg-hero-med-gray" style="width: 33.33%"></div>
                    <div class="bg-hero-light-gray" style="width: 33.34%"></div>
                </div>
                <div class="flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 33.33%"></div>
                    <div class="bg-hero-med-gray" style="width: 33.33%"></div>
                    <div class="bg-hero-light-gray" style="width: 33.34%"></div>
                </div>
            </div>

            <div class="flex items-center gap-6 text-gray-400 my-8 w-full z-10 relative">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="text-[16px] font-medium tracking-wide bg-white px-4 text-center">Efficiency repeated across visits creates capacity</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <div class="flex gap-4 w-full items-start">
                <div class="visit-bar flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 20%"></div>
                    <div class="bg-hero-med-gray" style="width: 40%"></div>
                    <div class="bg-hero-light-gray" style="width: 40%"></div>
                </div>
                <div class="visit-bar flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 20%"></div>
                    <div class="bg-hero-med-gray" style="width: 40%"></div>
                    <div class="bg-hero-light-gray" style="width: 40%"></div>
                </div>
                <div class="visit-bar flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 20%"></div>
                    <div class="bg-hero-med-gray" style="width: 40%"></div>
                    <div class="bg-hero-light-gray" style="width: 40%"></div>
                </div>
                <div class="visit-bar flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 20%"></div>
                    <div class="bg-hero-med-gray" style="width: 40%"></div>
                    <div class="bg-hero-light-gray" style="width: 40%"></div>
                </div>
                <div class="visit-bar flex h-14 rounded-md overflow-hidden shadow-sm opacity-60 flex-1">
                    <div class="bg-hero-blue" style="width: 20%"></div>
                    <div class="bg-hero-med-gray" style="width: 40%"></div>
                    <div class="bg-hero-light-gray" style="width: 40%"></div>
                </div>

                <div class="visit-bar flex flex-col items-center flex-1">
                    <div class="w-full h-14 rounded-md bg-new-dark-green shadow-sm flex items-center justify-center text-white font-semibold text-[15px] leading-tight">
                        New visit
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
